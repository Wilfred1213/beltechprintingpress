
{% extends 'beltechApp/base/base.html' %}
{% load static %}

{% block title %}send news letter {% endblock %}

{% block content %}
<section class="newsletter-dashboard pt-100 pb-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div style="background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <h2 style="font-weight: 800; color: #111; margin-bottom: 10px;">Send Newsletter</h2>
                    <p style="color: #777; margin-bottom: 30px;">This message will be sent to all active subscribers.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label style="font-weight: 700;">Subject</label>
                            {{ form.subject }}
                        </div>
                        <div class="mb-4">
                            <label style="font-weight: 700;">Message Content</label>
                            {{ form.message }}
                        </div>
                        
                        <button type="submit" class="tp-btn" style="background: #ff5a01; color: #fff; padding: 15px 30px; border: none; border-radius: 10px; font-weight: 700; width: 100%;">
                            <i class="fa-solid fa-paper-plane"></i> Blast Newsletter Now
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
