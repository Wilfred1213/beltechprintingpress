<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto; border: 1px solid #eee; border-radius: 10px; overflow: hidden;">
    <div style="background-color: #ff5a01; padding: 20px; text-align: center;">
        <h1 style="color: white; margin: 0;">New Message!</h1>
    </div>
    <div style="padding: 30px; color: #333;">
        <p>You have received a new inquiry from the <strong>Beltech Printing</strong> website.</p>
        <hr style="border: none; border-top: 1px solid #eee;">
        <p><strong>Customer Name:</strong> {{ name }}</p>
        <p><strong>Phone Number:</strong> {{ phone }}</p>
        <p><strong>Email:</strong> {{ email }}</p>
        <p><strong>Message:</strong></p>
        <div style="background: #fdf2e9; padding: 15px; border-left: 4px solid #ff5a01; font-style: italic;">
            "{{ message }}"
        </div>
    </div>
    <div style="background: #f4f4f4; padding: 15px; text-align: center; font-size: 12px; color: #777;">
        Sent from your website server in Maiduguri.
    </div>
</div>
