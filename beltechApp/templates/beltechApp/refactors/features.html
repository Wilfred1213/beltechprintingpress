
<!-- feature area start -->

<section class="tp-feature-2-area pt-120 pb-90">
    <div class="container">
        <div class="row">
            <div class="co-xl-6">
                <div class="tp-section-title-wrapper mb-50">
                    <h6 class="tp-section-sub-title">WE ALWYAS BELIEVE IN QUALITY</h6>
                    <h3 class="tp-section-title tp-split-text right">Beltech Printing Press</h3>
                </div>
            </div>
        </div>
        <div class="row mb-50">
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-top-wrapper">
                    <div class="tp-feature-2-icon"></div>
                </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-top-wrapper">
                    <div class="tp-feature-2-icon"></div>
                </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-top-wrapper">
                    <div class="tp-feature-2-icon"></div>
                </div>
            </div>
        </div>
        <div class="row">
            {% for feature in features %}
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-wrapper mb-30 wow fadeInUp" data-wow-delay=".3s" data-wow-duration="1s">
                    <div class="tp-feature-2-content">
                        <h4 class="tp-feature-2-title">{{ feature.title }}</h4>
                        <p class="tp-feature-2-paragraph">{{ feature.description }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
            
        </div>
    </div>
</section>
<!-- feature area end -->
