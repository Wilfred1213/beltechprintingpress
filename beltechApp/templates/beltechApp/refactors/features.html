
<!-- feature area start -->

<section class="tp-feature-2-area pt-120 pb-90">
    <div class="container">
        <div class="row">
            <div class="co-xl-6">
                <div class="tp-section-title-wrapper mb-50">
                    <h6 class="tp-section-sub-title">WE ALWYAS BELIEVE IN QUALITY</h6>
                    <h3 class="tp-section-title tp-split-text right">Beltech Printing Press</h3>
                </div>
            </div>
        </div>
        <div class="row mb-50">
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-top-wrapper">
                    <div class="tp-feature-2-icon"></div>
                </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-top-wrapper">
                    <div class="tp-feature-2-icon"></div>
                </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-4">
                <div class="tp-feature-2-top-wrapper">
                    <div class="tp-feature-2-icon"></div>
                </div>
            </div>
        </div>
        <div class="row">
            {% for feature in features %}
            <div class="col-xl-4 col-lg-4 col-md-6">
                <div class="tp-feature-2-wrapper mb-30 wow fadeInUp" 
                    style="background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; height: 100%; transition: 0.3s;" 
                    data-wow-delay=".3s" data-wow-duration="1s">
                    
                    <div class="tp-feature-2-thumb" style="position: relative; overflow: hidden;">
                        {% if feature.image %}
                            <img src="{{ feature.image.url }}" alt="{{ feature.title }}" 
                                style="width: 100%; height: 200px; object-fit: cover; transition: 0.5s;">
                        {% else %}
                            <div style="width: 100%; height: 200px; background: #fdf2e9; display: flex; align-items: center; justify-content: center;">
                                <i class="fa-light fa-star" style="font-size: 40px; color: #ff5a01;"></i>
                            </div>
                        {% endif %}
                        
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: #ff5a01;"></div>
                    </div>

                    <div class="tp-feature-2-content" style="padding: 30px;">
                        <h4 class="tp-feature-2-title" style="margin-bottom: 15px; font-size: 20px; transition: 0.3s;">
                            {{ feature.title }}
                        </h4>
                        <p class="tp-feature-2-paragraph" style="color: #666; line-height: 1.6; margin-bottom: 0;">
                            {{ feature.description }}
                        </p>
                    </div>
                </div>
            </div>
            {% endfor %}
            
        </div>
    </div>
</section>
<!-- feature area end -->
