
<div class="product_wrapper two mb-30 wow fadeInUp" data-wow-delay=".3s" data-wow-duration="1s">
    <div class="product__item" style="background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; transition: 0.4s; height: 100%; display: flex; flex-direction: column;">
        
        <div class="product__thumb w-img p-relative fix" style="position: relative; height: 240px; overflow: hidden;">
            <a href="{% url 'shop_detail' product.id %}">
                <img src="{{ product.image.url }}" alt="{{ product.name }}" 
                     style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease;">
            </a>
            
            <div style="position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <i class="fas fa-folder" style="color: #ff5a01; margin-right: 5px;"></i>
                {{ product.category.name|default:"General" }}
            </div>
        </div>

        <div class="product__content p-4" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
           
            <div style="margin-top: 15px; border-top: 1px solid #f5f5f5; pt-15">
                <div class="d-flex align-items-center justify-content-between mb-15" style="padding-top: 15px;">
                    <span style="font-size: 13px; color: #777; font-weight: 500;">Starting from:</span>
                    <span style="color: #ff5a01; font-weight: 900; font-size: 20px;">N{{ product.base_price }}/{{product.unit}}</span>
                </div>

                <a href="{{ product.whatsapp_link }}" target="_blank" 
                   style="background: #25d366; color: white; display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 700; gap: 10px; transition: 0.3s; width: 100%;">
                    <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i>
                    <span>Lets talk</span>
                </a>
            </div>
        </div>
    </div>
</div>


{% comment %} <div class="product_wrapper two mb-30 wow fadeInUp" data-wow-delay=".3s" data-wow-duration="1s">

        <div class="product__top-brand d-flex justify-content-between mb-15">

            </div>
            <div class="product__top-price">
                <a href="#">N{{ product.base_price }}</a>
            </div>

        <div class="product__thumb w-img p-relative fix mb-10">

                </div>

                <button type="button" class="product-add-cart-btn w-100">Add to Cart</button>

        </div>
        <div class="product__content text-center">

                <span><i class="fa-solid fa-star"></i></span>
                <span><i class="fa-solid fa-star"></i></span>
                <span><i class="fa-solid fa-star"></i></span>

        </div>

</div> {% endcomment %}
