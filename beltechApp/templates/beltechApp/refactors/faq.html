<div class="row justify-content-center">
    <div class="col-xl-8 col-lg-10">
        <div class="tp-faq-2-right-wrapper wow fadeInUp" data-wow-delay=".5s">
            <div class="tp-section-title-wrapper mb-50 text-center">
                <h6 class="tp-section-sub-title">FREQUENTLY ASKED QUESTION</h6>
                <h3 class="tp-section-title tp-split-text">What Our Clients Ask About Beltech</h3>
            </div>

            <div class="tp-faq-2-accordion accordion-flush" id="accordionFlushExample">
                {% for faq in faqs %}
                <div class="tp-faq-2-accordion-item accordion-item mb-20" style="border: 1px solid #ebebeb; border-radius: 12px; overflow: hidden; transition: all 0.3s ease;">
                    <h2 class="accordion-header tp-faq-2-accordion-header">
                        <button class="tp-faq-2-accordion-title accordion-button {% if not forloop.first %}collapsed{% endif %}" 
                                type="button" 
                                data-bs-toggle="collapse" 
                                data-bs-target="#flush-collapse-{{ forloop.counter }}" 
                                style="padding-right: 80px;"> {{ faq.question }}
                            <span class="tp-faq-2-accordion-btn"></span>
                        </button>
                    </h2>
                    
                    <div id="flush-collapse-{{ forloop.counter }}" 
                        class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" 
                        data-bs-parent="#accordionFlushExample">
                        <div class="tp-faq-2-accordion-pera accordion-body" style="padding: 0 25px 25px 25px; line-height: 1.8; color: #666;">
                            {{ faq.answer | safe }}
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div> 
        </div>
    </div>
</div>
