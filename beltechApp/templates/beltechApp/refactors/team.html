<section class="tp-team-area pt-0 pb-90">
    <div class="container">
        <div class="row">
            {% for team in teams %}
            <div class="col-xl-4 col-lg-6 col-md-6">
                <div class="tp-team-wrapper tp-costom-wrapper-hover p-relative fix mb-30 wow fadeInUp" data-wow-delay=".3s" data-wow-duration="1s">
                    <div class="tp-team-img fix">
                        <div class="tp-team-img-inner tp-costom-inner-hover">
                            <img src="{{ team.image.url }}" alt="">
                        </div>
                        <div class="tp-team-content">
                            <h4 class="tp-team-title">{{ team.name }}</h4>
                            <p>{{ team.role }}</p>
                            <div class="tp-team-social">
                                <div class="tp-team-btn">
                                    <button><i class="fa-sharp fa-regular fa-share-nodes"></i></button>
                                </div>
                                <div class="tp-team-icon">
                                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
